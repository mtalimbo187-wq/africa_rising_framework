version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: studio_user
      POSTGRES_PASSWORD: studio_password
      POSTGRES_DB: documentary_studio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://studio_user:studio_password@postgres:5432/documentary_studio
      REDIS_URL: redis://redis:6379/0
      RUNWAY_API_KEY: ${RUNWAY_API_KEY}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A src.queue.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://studio_user:studio_password@postgres:5432/documentary_studio
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  beat:
    build: .
    command: celery -A src.queue.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://studio_user:studio_password@postgres:5432/documentary_studio
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
